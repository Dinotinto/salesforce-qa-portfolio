name: Salesforce login
description: >-
  Installs the Salesforce CLI, logs in with an SFDX auth URL and exports
  SF_INSTANCE_URL / SF_ACCESS_TOKEN (masked) / SF_USERNAME for later steps.
inputs:
  auth-url:
    description: SFDX auth URL (from `sf org display --verbose --json`), passed in from a secret
    required: true
  alias:
    description: Org alias
    default: qa-org
  env-prefix:
    description: Prefix for the exported variables (e.g. SF_VIEWER_ for a second persona)
    default: SF_
  install-cli:
    description: Install the Salesforce CLI first
    default: "true"
runs:
  using: composite
  steps:
    - name: Install Salesforce CLI
      if: inputs.install-cli == 'true'
      shell: bash
      run: |
        npm install --global @salesforce/cli@2 || { echo "::error::Installing the Salesforce CLI failed"; exit 1; }
        sf version

    - name: Log in
      shell: bash
      env:
        AUTH_URL: ${{ inputs.auth-url }}
        ALIAS: ${{ inputs.alias }}
        PREFIX: ${{ inputs.env-prefix }}
      run: |
        if [ -z "$AUTH_URL" ]; then
          echo "::error::The Salesforce auth URL secret is empty. See README > CI setup."
          exit 1
        fi
        # Tolerate stray whitespace/quotes from copy-paste, then sanity-check the shape
        # (without ever printing the value).
        AUTH_URL=$(printf '%s' "$AUTH_URL" | tr -d '\r\n' | sed -e 's/^[[:space:]"]*//' -e 's/[[:space:]"]*$//')
        case "$AUTH_URL" in
          force://*@*) ;;
          *)
            echo "::error::The auth URL secret doesn't look like an SFDX auth URL. It must start with force:// and contain an @ (length ${#AUTH_URL}). Re-copy the 'Sfdx Auth Url' value from 'sf org display --verbose'."
            exit 1 ;;
        esac
        umask 077
        printf '%s' "$AUTH_URL" > "$RUNNER_TEMP/authurl"
        if ! sf org login sfdx-url --sfdx-url-file "$RUNNER_TEMP/authurl" --alias "$ALIAS" --set-default --json > "$RUNNER_TEMP/login.json" 2>&1; then
          MSG=$(jq -r '.message // .name // "unknown error"' "$RUNNER_TEMP/login.json" 2>/dev/null | head -c 400)
          echo "::error::Salesforce login failed: ${MSG}"
          rm -f "$RUNNER_TEMP/authurl" "$RUNNER_TEMP/login.json"
          exit 1
        fi
        rm -f "$RUNNER_TEMP/authurl" "$RUNNER_TEMP/login.json"

        # Read JSON only from stdout; warnings go to stderr.
        ORG_JSON=$(sf org display --target-org "$ALIAS" --json 2>/dev/null) || true
        INSTANCE=$(jq -r '.result.instanceUrl // empty' <<< "$ORG_JSON" 2>/dev/null || true)
        USERNAME=$(jq -r '.result.username // empty' <<< "$ORG_JSON" 2>/dev/null || true)

        # Newer CLI versions redact the token in 'org display'; ask for it explicitly.
        TOKEN=$(sf org auth show-access-token --target-org "$ALIAS" --json 2>/dev/null \
                | jq -r '.result.accessToken // .result.token // empty' 2>/dev/null || true)
        if [ -z "$TOKEN" ] || [[ "$TOKEN" == \[REDACTED* ]]; then
          TOKEN=$(jq -r '.result.accessToken // empty' <<< "$ORG_JSON" 2>/dev/null || true)
        fi
        if [ -z "$TOKEN" ] || [[ "$TOKEN" == \[REDACTED* ]] || [ -z "$INSTANCE" ]; then
          echo "::error::Logged in, but couldn't read the access token or instance URL from the Salesforce CLI ($(sf version 2>/dev/null | head -1))."
          exit 1
        fi
        echo "::add-mask::$TOKEN"
        {
          echo "${PREFIX}ACCESS_TOKEN=$TOKEN"
          echo "${PREFIX}INSTANCE_URL=$INSTANCE"
          echo "${PREFIX}USERNAME=$USERNAME"
        } >> "$GITHUB_ENV"
        echo "Logged in to $INSTANCE as $USERNAME"
